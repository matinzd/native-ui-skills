name: Validate skill
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository checks
        run: python3 tools/validate_skill.py
      - name: Linter self-test
        run: python3 tests/test_hig_lint.py
      - name: Agent Skills reference validator
        run: |
          pip install --quiet skills-ref==0.1.1
          for skill in skills/*/; do agentskills validate "$skill"; done
      - name: Cited Apple pages still exist
        if: github.event_name == 'schedule'
        run: python3 tools/validate_skill.py --online
